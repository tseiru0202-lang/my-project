<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ動画プレーヤー</title>
<style>
:root{--bg:#fff;--bg2:#f4f4f2;--tx:#1a1a1a;--tx2:#666;--bd:#ddd;--ac:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--bg2:#232323;--tx:#f0f0f0;--tx2:#a0a0a0;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:18px;font-weight:500;margin:4px 0 12px}
.bar{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{height:40px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
button:hover{background:var(--bg2)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#player{aspect-ratio:16/9;background:var(--bg2);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:12px}
.m{font-size:12px;color:var(--tx2);margin:2px 0 0;line-height:1.5}
.t{font-size:14px;font-weight:500;line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer;align-items:flex-start}
.row:hover{background:var(--bg2)}
.th{position:relative;flex:0 0 140px;aspect-ratio:16/9;background:var(--bg2);border-radius:8px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:1px 4px;border-radius:4px}
.sub{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
a{color:var(--ac)}
@media(min-width:600px){.th{flex-basis:200px}.t{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>マイ動画プレーヤー</h1>

  <div class="bar">
    <input id="q" type="text" placeholder="検索、または動画のURLを貼り付け">
    <button id="go" class="pri">検索</button>
  </div>
  <div class="bar">
    <input id="key" type="password" placeholder="YouTube Data API v3 のキー">
    <button id="save">保存</button>
  </div>

  <div id="player"><span class="m">動画を選ぶと、ここで再生されます。</span></div>
  <div id="info" style="margin:8px 0"></div>

  <div class="sub">
    <p id="head" class="m" style="font-weight:500;color:var(--tx);margin:0">キーワードを検索するか、急上昇を開きましょう。</p>
    <button id="trend">急上昇</button>
  </div>
  <p id="msg" class="m"></p>
  <div id="fb"></div>
  <div id="list"></div>
  <div id="more" style="margin-top:8px"></div>
</div>

<script>
var key = '', token = '', lastQ = '';
try { key = localStorage.getItem('yt_key') || ''; } catch (e) {}

var $ = function (i) { return document.getElementById(i); };
if (key) $('key').value = key;

var nf = new Intl.NumberFormat('ja-JP', { notation: 'compact' });

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML.replace(/"/g, '&quot;');
}
function dec(s) {
  var t = document.createElement('textarea');
  t.innerHTML = s || '';
  return t.value;
}
function msg(s) { $('msg').textContent = s; $('fb').innerHTML = ''; }
function parseId(s) {
  var m = s.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function dur(iso) {
  var m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || '');
  if (!m) return '';
  var h = +m[1] || 0, mi = +m[2] || 0, s = +m[3] || 0;
  if (!h && !mi && !s) return 'ライブ';
  var p = function (n) { return n < 10 ? '0' + n : '' + n; };
  return h ? h + ':' + p(mi) + ':' + p(s) : mi + ':' + p(s);
}

function play(id, title, ch) {
  $('player').innerHTML =
    '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
    '?autoplay=1&playsinline=1&rel=0" title="動画プレーヤー" ' +
    'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" ' +
    'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen ' +
    'style="width:100%;height:100%;border:0;display:block"></iframe>';
  $('info').innerHTML =
    '<p class="t" style="-webkit-line-clamp:2;font-size:16px">' + esc(title || '再生中') + '</p>' +
    '<p class="m">' + esc(ch || '') + '</p>' +
    '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener" style="font-size:13px">YouTubeで開く</a>';
  try { $('player').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

function addRow(v) {
  var d = document.createElement('div');
  d.className = 'row';
  d.setAttribute('role', 'button');
  d.tabIndex = 0;
  d.innerHTML =
    '<div class="th"><img alt="" loading="lazy" src="' + esc(v.thumb) + '" onerror="this.style.display=\'none\'">' +
    (v.dur ? '<span class="dur">' + esc(v.dur) + '</span>' : '') + '</div>' +
    '<div style="min-width:0;flex:1"><p class="t">' + esc(v.title) + '</p>' +
    '<p class="m">' + esc(v.ch) + '</p><p class="m">' + esc(v.meta) + '</p></div>';
  d.onclick = function () { play(v.id, v.title, v.ch); };
  d.onkeydown = function (e) { if (e.key === 'Enter') play(v.id, v.title, v.ch); };
  $('list').appendChild(d);
}

function norm(it, det) {
  var sn = it.snippet;
  var id = typeof it.id === 'string' ? it.id : it.id.videoId;
  var d = det || it, cd = d.contentDetails || {}, st = d.statistics || {}, parts = [];
  if (st.viewCount) parts.push(nf.format(+st.viewCount) + ' 回視聴');
  parts.push(new Date(sn.publishedAt).toLocaleDateString('ja-JP'));
  var th = sn.thumbnails || {};
  return {
    id: id,
    title: dec(sn.title),
    ch: dec(sn.channelTitle),
    thumb: (th.medium || th.default || {}).url || '',
    dur: dur(cd.duration),
    meta: parts.join(' ・ ')
  };
}

async function api(path, params) {
  params.key = key;
  var r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + new URLSearchParams(params));
  var j = await r.json();
  if (j.error) throw new Error(j.error.message || 'APIエラー');
  return j;
}

async function load(kind, more) {
  if (!key) { msg('先にAPIキーを入力して、保存を押してください。'); return; }
  if (!more) { $('list').innerHTML = ''; token = ''; $('more').innerHTML = ''; }
  msg('読み込み中…');
  try {
    var j, items;
    if (kind === 'trend') {
      var p1 = { part: 'snippet,contentDetails,statistics', chart: 'mostPopular', regionCode: 'JP', maxResults: '12' };
      if (more && token) p1.pageToken = token;
      j = await api('videos', p1);
      items = j.items.map(function (it) { return norm(it); });
    } else {
      var p = { part: 'snippet', type: 'video', maxResults: '12', q: lastQ, regionCode: 'JP', relevanceLanguage: 'ja' };
      if (more && token) p.pageToken = token;
      j = await api('search', p);
      var valid = j.items.filter(function (i) { return i.id && i.id.videoId; });
      var ids = valid.map(function (i) { return i.id.videoId; }).join(',');
      var dj = ids ? await api('videos', { part: 'contentDetails,statistics', id: ids }) : { items: [] };
      var map = {};
      dj.items.forEach(function (x) { map[x.id] = x; });
      items = valid.map(function (i) { return norm(i, map[i.id.videoId]); });
    }
    token = j.nextPageToken || '';
    items.forEach(addRow);
    $('head').textContent = kind === 'trend' ? '急上昇' : '「' + lastQ + '」の検索結果';
    msg(items.length ? '' : '見つかりませんでした。別のキーワードを試してください。');
    $('more').innerHTML = '';
    if (token) {
      var b = document.createElement('button');
      b.textContent = 'もっと見る';
      b.style.width = '100%';
      b.onclick = function () { load(kind, true); };
      $('more').appendChild(b);
    }
  } catch (e) {
    if (e instanceof TypeError) {
      msg('通信できませんでした。ネットワーク接続を確認してください。');
      if (kind !== 'trend') {
        var f = document.createElement('button');
        f.textContent = 'YouTubeで検索を開く';
        f.style.margin = '6px 0';
        f.onclick = function () {
          window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(lastQ), '_blank', 'noopener');
        };
        $('fb').appendChild(f);
      }
    } else {
      msg('エラー: ' + e.message);
    }
  }
}

function submit() {
  var v = $('q').value.trim();
  if (!v) { msg('キーワードか動画のURLを入力してください。'); return; }
  var id = parseId(v);
  if (id) { play(id, '', ''); msg(''); return; }
  lastQ = v;
  load('search', false);
}

$('go').onclick = submit;
$('q').onkeydown = function (e) { if (e.key === 'Enter') submit(); };
$('trend').onclick = function () { load('trend', false); };
$('save').onclick = function () {
  var v = $('key').value.trim();
  if (!v) { msg('APIキーを入力してください。'); return; }
  key = v;
  try { localStorage.setItem('yt_key', key); } catch (e) {}
  msg('APIキーを保存しました。');
  load('trend', false);
};
$('key').oninput = function () { msg(''); };

if (key) load('trend', false);
</script>
</body>
</html>
